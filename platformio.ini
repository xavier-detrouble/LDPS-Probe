; PlatformIO Configuration — LDPS-Probe
; ESP32-S3 N16R8: ESP-NOW bridge + SX1262 TX + WS2812 signal analyzer
; Production test board for Edge-Node manufacturing

[env:probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTB_VERSION=\"1.0.0\"
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    jgromes/RadioLib@^6.6.0
